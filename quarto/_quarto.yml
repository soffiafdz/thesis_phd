project:
  type: default
  output-dir: _output

format:
  html:
    toc: true
    toc-depth: 3
    number-sections: true
    theme: cosmo
  pdf:
    documentclass: article
    papersize: letter
    geometry:
      - margin=1in
    keep-tex: true

execute:
  echo: false
  warning: false
  message: false
  freeze: auto

knitr:
  opts_chunk:
    fig.width: 8
    fig.height: 6
    dpi: 300
