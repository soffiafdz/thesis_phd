project:
  type: book
  output-dir: _book

execute:
  echo: false
  warning: false
  message: false

book:
  title: "Title of Your Thesis"
  author: "Santiago Fernandez"
  date: today
  chapters:
    - index.qmd
    - content/abstract_en.qmd
    - content/abstract_fr.qmd
    - content/acknowledgements.qmd
    - content/chapter1.qmd        # Introduction
    - content/chapter2.qmd        # Background
    - content/chapter3.qmd        # Paper 1 — Qrater
    - content/chapter4.qmd        # Paper 2 — HVR Validation
    - content/chapter5.qmd        # Paper 3 — Sex Differences
    # - content/chapter6.qmd      # Paper 4 — CVR Mediation (blocked)
    - content/chapter7.qmd        # Discussion & Conclusion
    - content/publications.qmd
    - content/acronyms.qmd

bibliography: references.bib

filters:
  - _filters/thesis.lua

format:
  pdf:
    documentclass: book
    classoption: [12pt, oneside]
    include-in-header: _templates/preamble.tex
    include-before-body: _templates/before-body.tex
    template-partials:
      - _templates/title.tex
    toc: false
    lof: false
    lot: false
    number-sections: true
    linestretch: 1.5
    colorlinks: false
    latex-min-runs: 3
    keep-tex: true
