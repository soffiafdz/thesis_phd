project:
  type: book
  output-dir: _book

execute:
  echo: false
  warning: false
  message: false
  freeze: auto

knitr:
  opts_chunk:
    dev: "cairo_pdf"

book:
  title: "The hippocampal-to-ventricle ratio: validation, normative modeling, and clinical application of a self-normalizing biomarker for brain aging"
  output-file: Fernandez-Lozano_Sofia_IPN_thesis
  author: "Sofía Fernández-Lozano"

  chapters:
    - index.qmd
    - content/abstract_en.qmd
    - content/abstract_fr.qmd
    - content/acknowledgements.qmd
    - content/acronyms.qmd
    - content/chapter1.qmd        # Introduction
    - content/chapter2.qmd        # Background
    - content/chapter3.qmd        # Paper 1 — Qrater
    - content/chapter4.qmd        # Paper 2 — HVR Validation
    - content/chapter5.qmd        # Paper 3 — Sex Differences
    - content/chapter6.qmd        # Paper 4 — CVR Mediation
    - content/chapter7.qmd        # Discussion & Conclusion
    - content/references.qmd       # Complete bibliography

bibliography: references.bib
reference-section-title: "References"

filters:
  - _filters/thesis.lua

format:
  pdf:
    documentclass: book
    classoption: [12pt, oneside]
    include-in-header: _templates/preamble.tex
    include-before-body: _templates/before-body.tex
    toc: false
    lof: false
    lot: false
    number-sections: true
    linestretch: 1.5
    colorlinks: false
    pdf-engine: tectonic
    pdf-engine-opts:
      - "--keep-intermediates"
    keep-tex: false
